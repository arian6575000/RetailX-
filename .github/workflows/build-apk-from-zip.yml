# Universal APK builder (Expo / React Native, Android only) - same file for every repo.
# Put it at .github/workflows/build-apk-from-zip.yml, upload your project .zip to the repo ROOT (any name),
# then Actions > "Build APK from zip" > Run workflow.
name: Build APK from zip

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip file name in repo root (leave empty = the only .zip in root)'
        required: false
        default: ''
      run_tests:
        description: 'Run typecheck + tests before building'
        type: boolean
        default: true
      publish_release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional release signing: set ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract the zip
        env:
          ZIP_INPUT: ${{ inputs.zip_name }}
        run: |
          set -e
          shopt -s nullglob nocaseglob
          if [ -n "$ZIP_INPUT" ]; then
            [ -f "$ZIP_INPUT" ] || { echo "::error::'$ZIP_INPUT' not found in repo root"; ls; exit 1; }
            ZIP="$ZIP_INPUT"
          else
            zips=(*.zip)
            [ ${#zips[@]} -ge 1 ] || { echo "::error::No .zip file in repo root"; exit 1; }
            [ ${#zips[@]} -eq 1 ] || { echo "::error::More than one zip in root (${zips[*]}). Enter zip_name."; exit 1; }
            ZIP="${zips[0]}"
          fi
          echo "Using: $ZIP"
          rm -rf "$RUNNER_TEMP/src" && mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -x '__MACOSX/*' -d "$RUNNER_TEMP/src"
          # project root = folder holding package.json (zip root or one level down)
          PKG=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$PKG" ] || { echo "::error::No package.json inside $ZIP"; exit 1; }
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps || npm install --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: Generate placeholder icons (only if the project has the script)
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f scripts/make-icons.mjs ]; then npm install --no-save --legacy-peer-deps sharp && node scripts/make-icons.mjs; fi

      - name: Typecheck and tests
        if: ${{ inputs.run_tests }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi
          npm test --if-present

      - name: Prepare release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Read app name
        working-directory: ${{ env.APP_DIR }}
        run: echo "APP_SLUG=$(node -p "require('./app.json').expo.slug")" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Collect APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APP_DIR"/android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/${APP_SLUG}-${{ github.run_number }}.apk"
          ls -la "$RUNNER_TEMP/out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/out/*.apk

      - name: Publish APK as a GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ${{ env.APP_SLUG }} APK #${{ github.run_number }}
          body: Built from ${{ env.ZIP_NAME }}
          files: ${{ runner.temp }}/out/*.apk
